<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>自卫吧 · 节律日记</title>
    <script>
      // GitHub Pages SPA fallback for Project Pages (base="/LUVSIC/")
      //
      // IMPORTANT：这是整个验证链接 404 修复的最关键第一层。
      // 用户点邮件里的 ConfirmationURL，会先请求：
      //   https://sillyrun2luv.github.io/LUVSIC#access_token=...&type=signup
      // 由于 pathname 是 "/LUVSIC"（非 "/LUVSIC/" 也非现有静态文件），
      // GitHub Pages 会直接走 404.html 接管。这里发生的 **window.location.replace()**
      // 如果不先保存 URL hash，手机微信/QQ 内置浏览器会直接把 hash 丢掉，
      // 导致后续 index.html / Supabase SDK 根本看不到 access_token → 404 或空白页。
      //
      // 因此此脚本顺序必须是：
      //   1) 立刻把 access_token（连同整串 hash）写入 sessionStorage 备份
      //   2) 再 replace 到正确的项目根路径 /LUVSIC/
      //  （稍后 index.html 会从 sessionStorage 恢复 hash，Supabase SDK 才能解析）
      (function () {
        try {
          var RAW_HASH = window.location.hash || '';
          var HAS_ACCESS_TOKEN =
            /access_token=/.test(window.location.href) || /^#?access_token=/.test(RAW_HASH);
          if (HAS_ACCESS_TOKEN) {
            var normalized = RAW_HASH.charAt(0) === '#' ? RAW_HASH : '#' + RAW_HASH;
            window.sessionStorage.setItem('luvsic.authHash', normalized);
            window.sessionStorage.setItem('luvsic.authHashAt', String(Date.now()));
          }
        } catch (e) {
          // storage 失败就算了，别阻塞重定向
        }

        try {
          var pathSegments = window.location.pathname.split('/').filter(Boolean);
          var projectName = pathSegments[0] || 'LUVSIC';
          if (!/^[A-Za-z0-9_.-]+$/.test(projectName)) projectName = 'LUVSIC';

          var correctPath = '/' + projectName + '/';
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var target = window.location.origin + correctPath + search + hash;
          try {
            window.location.replace(target);
          } catch (e2) {
            window.location.href = target;
          }
        } catch (e3) {
          // 最后兜底：最不济也跳回 LUVSIC 根，不留在 404 白页
          try {
            window.location.href = window.location.origin + '/LUVSIC/';
          } catch (_) {}
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
