name: Deploy to GitHub Pages + Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-pwa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build PWA
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://xfjqpbywcjjaiwyzibtu.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmanFwYnl3Y2pqYWl3eXppYnR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTcwNzcsImV4cCI6MjEwMTk5MzA3N30.JXshm5cghu5jAFK_tIKUiu9qAwazhFD2G4vBPbZ9mGA

      - name: Upload PWA artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pwa:
    needs: build-pwa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-release-apk:
    needs: build-pwa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          sdkmanager --list_installed

      - name: Rebuild PWA (for Capacitor sync)
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://xfjqpbywcjjaiwyzibtu.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhmanFwYnl3Y2pqYWl3eXppYnR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MTcwNzcsImV4cCI6MjEwMTk5MzA3N30.JXshm5cghu5jAFK_tIKUiu9qAwazhFD2G4vBPbZ9mGA

      - name: Capacitor sync to Android
        run: npx cap sync android

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace --info
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}

      - name: Copy and rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ziweiba.apk

      - name: Read version and notes from version.json
        id: read_info
        run: |
          VERSION=$(jq -r '.version' public/version.json)
          NOTES=$(jq -r '.notes' public/version.json)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.read_info.outputs.VERSION }}
          name: v${{ steps.read_info.outputs.VERSION }}
          body: ${{ steps.read_info.outputs.NOTES }}
          files: ziweiba.apk
          generate_release_notes: false
          fail_on_unmatched_files: true
